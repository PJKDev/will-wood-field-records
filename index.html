<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09080b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Field Records"><title>Will Wood Field Records</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root{--paper:#f0e9e4;--ink:#100e12;--plum:#786b91;--rose:#9b7186;--line:rgba(240,233,228,.35)}
*{box-sizing:border-box}html{min-height:100%;background:#08080a}body{margin:0;min-height:100vh;color:var(--paper);font-family:Georgia,'Times New Roman',serif;background-image:linear-gradient(#08070a9c,#08070a9c),url('background.jpg');background-size:cover;background-position:center;background-attachment:fixed}
button,input,textarea{font:inherit}.shell{max-width:620px;margin:auto;min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) 19px calc(36px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.mast{position:relative;min-height:90px}.eyebrow{font-family:Georgia,serif;font-size:13px;letter-spacing:.17em;text-transform:uppercase;opacity:.88;transform:rotate(-2deg);display:inline-block;text-shadow:1px 1px #5d4c68}.brand{position:absolute;right:2px;top:24px;font-family:Georgia,serif;font-size:clamp(27px,8vw,42px);font-weight:400;letter-spacing:-.06em;transform:rotate(2deg);text-shadow:1px 1px #76617c,-1px 0 #fff;white-space:nowrap}.brand span{display:inline-block}.counter-wrap{height:250px;display:grid;place-items:center;position:relative;isolation:isolate}.counter-wrap:before{content:"";position:absolute;inset:22px 5%;background:rgba(5,4,7,.44);border:1px solid rgba(255,255,255,.12);border-radius:48% 52% 43% 57% / 53% 44% 56% 47%;filter:blur(.2px);z-index:-1}.counter{font-family:Georgia,'Times New Roman',serif;font-size:clamp(112px,34vw,190px);font-weight:400;line-height:1;letter-spacing:-.09em;color:#f2eae5;text-shadow:3px 3px 0 #55455e,-1px -1px 0 #fff;animation:none;will-change:transform;user-select:none;transform:translate3d(0,0,0)}.counter.bump{animation:shiver .42s ease-out}@keyframes shiver{0%,100%{filter:none}20%{filter:drop-shadow(2px 0 #a77d98)}40%{filter:drop-shadow(-2px 1px #8c82ad)}60%{filter:drop-shadow(1px -2px #fff)}80%{filter:drop-shadow(-1px 1px #a77d98)}}
.counter-label{position:absolute;bottom:15px;left:50%;transform:translateX(-50%) rotate(-2deg);font-size:14px;letter-spacing:.19em;text-transform:uppercase;white-space:nowrap;text-shadow:1px 1px #171019}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.section-head h2{font-size:25px;font-weight:400;margin:0;transform:rotate(-1.5deg);text-shadow:1px 1px #6d536d}.small{font-size:11px;letter-spacing:.13em;text-transform:uppercase;opacity:.8;transform:rotate(2deg)}
.entries{display:flex;flex-direction:column;gap:9px}.entry{position:relative;background:rgba(8,7,10,.78);border:1px solid var(--line);padding:13px 15px 12px;backdrop-filter:blur(4px);box-shadow:3px 3px 0 rgba(83,66,88,.48);transform:rotate(var(--tilt,0deg));}.entry:nth-child(odd){--tilt:-.45deg}.entry:nth-child(even){--tilt:.55deg}.entry-title{font-size:22px;line-height:1.12;margin:0 0 7px;text-shadow:.6px .6px #92788e}.entry-meta{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.06em;opacity:.85;line-height:1.6}.entry-note{font-family:Georgia,serif;font-size:13px;margin-top:7px;opacity:.86;font-style:italic}.empty{padding:20px;text-align:center;background:#09080ab8;border:1px dashed var(--line);font-style:italic;line-height:1.5}
.add{border:1px solid rgba(255,255,255,.58);background:#211a25e8;color:var(--paper);padding:15px 18px;font-size:17px;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-.6deg);box-shadow:4px 4px 0 #63536b;cursor:pointer}.add:active{transform:translate(2px,2px) rotate(.5deg);box-shadow:1px 1px 0 #63536b}.foot{text-align:center;font-size:11px;letter-spacing:.12em;opacity:.65;margin-top:auto;padding-top:10px}
.dialog{position:fixed;inset:0;background:#050407d9;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:5}.dialog.open{display:flex}.panel{width:min(100%,560px);background:#17131a;border:1px solid #8e7d91;padding:20px;box-shadow:0 0 0 5px #0b090d;max-height:90vh;overflow:auto}.panel h2{font-size:27px;font-weight:400;margin:0 0 15px;transform:rotate(-1deg)}label{display:block;font-family:Arial,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:13px 0 6px}input,textarea{width:100%;padding:12px;background:#09080c;color:#f3eae5;border:1px solid #75677b;border-radius:0;font-size:16px}textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:13px;background:#5c4b65;color:white;border:1px solid #a99aaa}.actions .cancel{background:transparent}.delete{float:right;background:transparent;color:#e6b7c9;border:0;font-size:12px;text-decoration:underline;padding:4px}
@media(prefers-reduced-motion:reduce){.counter{animation:none!important;transform:none!important}}
</style></head><body><main class="shell" id="app">
<header class="mast"><div class="eyebrow">An unofficial field journal</div><div class="brand" aria-label="Will Wood"><span>W</span>ill <span>W</span>ood</div></header>
<section class="counter-wrap" aria-label="Albums discovered"><div class="counter" id="count">0</div><div class="counter-label">Albums discovered</div></section>
<section><div class="section-head"><h2>Found in the wild</h2><span class="small" id="totalLabel">0 records</span></div><div class="entries" id="entries"><div class="empty">No sightings recorded yet.<br>Keep your eyes open.</div></div></section>
<button class="add" id="openForm">＋ Record a sighting</button><div class="foot">FIELD RECORDS · KEEP LOOKING</div></main>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="formTitle"><form class="panel" id="sightingForm"><button type="button" class="delete" id="closeForm">CLOSE ✕</button><h2 id="formTitle">A new discovery</h2><label for="album">Album / release</label><input id="album" maxlength="90" placeholder="What did you find?" required><label for="place">Where was it?</label><input id="place" maxlength="100" placeholder="Record store, thrift shop, etc."><label for="date">Date found</label><input id="date" type="date" required><label for="note">Notes (optional)</label><textarea id="note" maxlength="300" placeholder="Anything unusual about this sighting..."></textarea><div class="actions"><button type="button" class="cancel" id="cancelForm">Cancel</button><button type="submit">Save sighting</button></div></form></div>
<script>
const KEY='ww-field-records-v1';let records=[];try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){records=[]}
const $=id=>document.getElementById(id);const count=$('count'),entries=$('entries'),dialog=$('dialog');
// Smooth parametric sideways-eight motion: continuous velocity, no waypoint pauses.
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');let orbitFrame=0;function animateCounter(now){if(reduceMotion.matches||document.hidden){count.style.transform='translate3d(0,0,0)';orbitFrame=0;return}const t=now/1000;const x=Math.sin(t*.48)*25;const y=Math.sin(t*.96)*17;const tilt=Math.sin(t*.48+.7)*1.35;count.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${tilt.toFixed(2)}deg)`;orbitFrame=requestAnimationFrame(animateCounter)}function startOrbit(){if(!reduceMotion.matches&&!document.hidden&&!orbitFrame)orbitFrame=requestAnimationFrame(animateCounter)}function stopOrbit(){if(orbitFrame){cancelAnimationFrame(orbitFrame);orbitFrame=0}count.style.transform='translate3d(0,0,0)'}document.addEventListener('visibilitychange',()=>{if(document.hidden)stopOrbit();else startOrbit()});reduceMotion.addEventListener?.('change',()=>{if(reduceMotion.matches)stopOrbit();else startOrbit()});startOrbit();
function save(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function render(){count.textContent=records.length;$('totalLabel').textContent=records.length+' '+(records.length===1?'record':'records');if(!records.length){entries.innerHTML='<div class="empty">No sightings recorded yet.<br>Keep your eyes open.</div>';return}entries.innerHTML='';records.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).forEach(r=>{const el=document.createElement('article');el.className='entry';const title=document.createElement('h3');title.className='entry-title';title.textContent=r.album;const meta=document.createElement('div');meta.className='entry-meta';meta.textContent=[r.place||'Location not recorded',new Date(r.date+'T12:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})].join(' · ');el.append(title,meta);if(r.note){const note=document.createElement('div');note.className='entry-note';note.textContent=r.note;el.append(note)}const del=document.createElement('button');del.className='delete';del.textContent='REMOVE';del.setAttribute('aria-label','Remove '+r.album);del.addEventListener('click',()=>{if(confirm('Remove this sighting?')){records=records.filter(x=>x.id!==r.id);save()}});el.append(del);entries.append(el)})}
function open(){dialog.classList.add('open');$('date').value=new Date().toLocaleDateString('en-CA');setTimeout(()=>$('album').focus(),50)}function close(){dialog.classList.remove('open');$('sightingForm').reset()}
$('openForm').addEventListener('click',open);$('closeForm').addEventListener('click',close);$('cancelForm').addEventListener('click',close);dialog.addEventListener('click',e=>{if(e.target===dialog)close()});$('sightingForm').addEventListener('submit',e=>{e.preventDefault();records.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),album:$('album').value.trim(),place:$('place').value.trim(),date:$('date').value,note:$('note').value.trim(),created:Date.now()});save();close();count.classList.remove('bump');void count.offsetWidth;count.classList.add('bump')});
let lastTouch=0;document.addEventListener('touchstart',()=>{lastTouch=Date.now()},{passive:true});document.addEventListener('touchend',()=>{if(Date.now()-lastTouch>180){count.classList.remove('bump');void count.offsetWidth;count.classList.add('bump')}},{passive:true});let scrollTick=false;window.addEventListener('scroll',()=>{if(!scrollTick){scrollTick=true;count.classList.remove('bump');void count.offsetWidth;count.classList.add('bump');setTimeout(()=>scrollTick=false,350)}},{passive:true});render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
